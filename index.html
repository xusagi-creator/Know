<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Freedom</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090d0b;--bg2:#101815;--bg3:#182320;
  --brd:#1c2e25;--brd2:#264034;
  --fg:#e2ebe6;--fg2:#8fa89c;--fg3:#556e62;
  --grn:#22c55e;--grn2:#16a34a;--grnBg:rgba(34,197,94,.08);--grnBdr:rgba(34,197,94,.18);
  --red:#ef4444;--redBg:rgba(239,68,68,.08);--redBdr:rgba(239,68,68,.2);
  --amb:#f59e0b;--ambBg:rgba(245,158,11,.08);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg)}

/* ─── Views ─── */
.v{display:none;position:absolute;inset:0}.v.on{display:flex}

/* ─── Inputs ─── */
.ipt{
  width:100%;background:var(--bg);border:1px solid var(--brd);color:var(--fg);
  padding:11px 14px;border-radius:10px;font-size:14px;font-family:inherit;
  outline:none;transition:border-color .15s;-webkit-appearance:none;
}
.ipt::placeholder{color:var(--fg3)}
.ipt:focus{border-color:var(--grn)}
textarea.ipt{resize:none;line-height:1.45}

/* ─── Buttons ─── */
.bp{
  background:var(--grn);color:#000;font-weight:600;padding:11px 20px;border-radius:10px;
  border:none;cursor:pointer;font-size:14px;font-family:inherit;
  transition:all .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  -webkit-tap-highlight-color:transparent;
}
.bp:hover{background:var(--grn2)}.bp:active{transform:scale(.97)}
.bp:disabled{opacity:.35;cursor:default;transform:none}
.bs{
  background:var(--bg3);color:var(--fg);font-weight:500;padding:11px 20px;border-radius:10px;
  border:1px solid var(--brd);cursor:pointer;font-size:14px;font-family:inherit;
  transition:all .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  -webkit-tap-highlight-color:transparent;
}
.bs:hover{border-color:var(--brd2)}
.bd{
  background:var(--redBg);color:var(--red);font-weight:600;padding:9px 16px;border-radius:9px;
  border:1px solid var(--redBdr);cursor:pointer;font-size:13px;font-family:inherit;
  transition:all .12s;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  -webkit-tap-highlight-color:transparent;
}
.bd:hover{background:rgba(239,68,68,.14)}
.bi{
  background:none;border:none;color:var(--fg3);width:36px;height:36px;border-radius:8px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;
  flex-shrink:0;-webkit-tap-highlight-color:transparent;
}
.bi:hover{background:var(--bg3);color:var(--fg)}

/* ─── Scrollbar ─── */
.scrl::-webkit-scrollbar{width:4px}
.scrl::-webkit-scrollbar-track{background:transparent}
.scrl::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px}

/* ═══════════ LOBBY ═══════════ */
#vL{
  flex-direction:column;align-items:center;justify-content:center;
  padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.li{width:100%;max-width:520px}
.rr{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:var(--bg2);border:1px solid var(--brd);border-radius:12px;
  cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent;
}
.rr:hover{border-color:var(--brd2);background:var(--bg3)}
.rr:active{transform:scale(.99)}
.rc{
  font-family:'Inter',monospace;font-weight:700;letter-spacing:1.5px;font-size:11px;
  color:var(--grn);background:var(--grnBg);border:1px solid var(--grnBdr);
  padding:3px 8px;border-radius:6px;cursor:pointer;transition:all .12s;white-space:nowrap;
}
.rc:hover{background:rgba(34,197,94,.15)}

/* ═══════════ ALLOW ═══════════ */
#vA{flex-direction:column;align-items:center;justify-content:center;padding:20px}
.ac{
  background:var(--bg2);border:1px solid var(--brd);border-radius:16px;
  padding:36px 28px;max-width:380px;width:100%;text-align:center;
}
.ab{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;
  padding:4px 10px;border-radius:6px;
}

/* ═══════════ CHAT ═══════════ */
#vC{flex-direction:column}
.ch{
  background:var(--bg2);border-bottom:1px solid var(--brd);
  padding:10px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;
  padding-top:calc(10px + var(--safe-t));
}
.cb{flex:1;display:flex;overflow:hidden;position:relative}
.cm{
  flex:1;overflow-y:auto;padding:12px 14px 8px;
  display:flex;flex-direction:column;gap:3px;
  -webkit-overflow-scrolling:touch;
}
.ci{
  background:var(--bg2);border-top:1px solid var(--brd);
  padding:8px 12px;padding-bottom:calc(8px + var(--safe-b));flex-shrink:0;
}

/* ─── Messages ─── */
.m{max-width:70%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.45;word-wrap:break-word;overflow-wrap:break-word}
.m.o{background:var(--bg3);align-self:flex-start;border-bottom-left-radius:4px}
.m.s{background:var(--grnBg);border:1px solid var(--grnBdr);align-self:flex-end;border-bottom-right-radius:4px}
.m.y{background:none;color:var(--fg3);font-size:12px;align-self:center;padding:3px 0;max-width:90%}
.m img{max-width:240px;max-height:240px;border-radius:10px;margin-top:6px;display:block}
.mn{font-size:11px;font-weight:600;color:var(--grn);margin-bottom:2px}
.mt{font-size:10px;color:var(--fg3);margin-top:2px;text-align:right}
.m.x{opacity:.15;text-decoration:line-through;pointer-events:none}

/* ─── Typing ─── */
.ty{font-size:11px;color:var(--fg3);padding:2px 4px;height:18px;display:flex;align-items:center;gap:4px}
.td{width:3px;height:3px;background:var(--fg3);border-radius:50%;animation:tb 1.4s infinite}
.td:nth-child(2){animation-delay:.15s}.td:nth-child(3){animation-delay:.3s}

/* ─── Input bar ─── */
.ib{display:flex;align-items:flex-end;gap:6px}
.ib textarea{
  flex:1;background:var(--bg);border:1px solid var(--brd);color:var(--fg);
  padding:10px 14px;border-radius:22px;font-size:14px;font-family:inherit;
  outline:none;resize:none;max-height:100px;line-height:1.4;transition:border-color .15s;
  -webkit-appearance:none;
}
.ib textarea::placeholder{color:var(--fg3)}
.ib textarea:focus{border-color:var(--grn)}
.sb-btn{
  width:36px;height:36px;border-radius:50%;background:var(--grn);border:none;
  color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;opacity:0;transform:scale(.6);pointer-events:none;
}
.sb-btn.v{opacity:1;transform:scale(1);pointer-events:auto}
.sb-btn:hover{background:var(--grn2)}.sb-btn:active{transform:scale(.88)}

/* ─── Sidebar ─── */
.sb{
  width:260px;background:var(--bg2);border-left:1px solid var(--brd);
  display:flex;flex-direction:column;flex-shrink:0;
  transition:transform .2s ease;
}
.sb-h{padding:14px 16px;border-bottom:1px solid var(--brd);font-size:13px;font-weight:600;color:var(--fg2)}
.sb-b{flex:1;overflow-y:auto;padding:6px;-webkit-overflow-scrolling:touch}
.ur{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;transition:background .1s}
.ur:hover{background:var(--bg3)}
.ua{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;color:#fff}

/* ─── Sidebar overlay (mobile) ─── */
.sb-ov{
  position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.sb-ov.on{opacity:1;pointer-events:auto}

/* ─── Modals ─── */
.mov{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;
  display:none;align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.mov.on{display:flex}
.mdl{
  background:var(--bg2);border:1px solid var(--brd);border-radius:16px;
  padding:22px;width:100%;max-width:400px;
  animation:mIn .2s ease-out;max-height:85vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.mdl.lg{max-width:480px}

/* ─── Toast ─── */
.tc{
  position:fixed;top:calc(12px + var(--safe-t));left:12px;right:12px;z-index:200;
  display:flex;flex-direction:column;gap:6px;pointer-events:none;
}
@media(min-width:480px){.tc{left:auto;right:16px;width:auto;max-width:340px}}
.ts{
  background:var(--bg3);border:1px solid var(--brd);color:var(--fg);
  padding:10px 14px;border-radius:10px;font-size:13px;pointer-events:auto;
  animation:tIn .2s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.5);
  display:flex;align-items:center;gap:8px;
}
.ts.e{border-color:var(--redBdr);color:var(--red)}
.ts.s{border-color:var(--grnBdr);color:var(--grn)}

/* ─── Checkbox ─── */
.ck{
  display:flex;align-items:flex-start;gap:10px;cursor:pointer;
  padding:11px 12px;background:var(--bg);border:1px solid var(--brd);
  border-radius:10px;transition:border-color .12s;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.ck:hover{border-color:var(--brd2)}
.ck input{display:none}
.ckb{
  width:18px;height:18px;border-radius:5px;border:2px solid var(--brd2);
  display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;margin-top:1px;
}
.ck input:checked~.ckb{background:var(--grn);border-color:var(--grn)}
.ckb i{font-size:9px;color:#000;opacity:0;transition:opacity .1s}
.ck input:checked~.ckb i{opacity:1}

/* ─── Password toggle ─── */
.pw{position:relative}
.pt{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--fg3);cursor:pointer;font-size:13px;padding:4px;
}

/* ─── Image preview ─── */
.ip{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--bg3);border-radius:10px;margin-bottom:6px;
}
.ip img{height:36px;border-radius:6px}

/* ─── Capture overlay ─── */
#capOv{
  position:fixed;inset:0;z-index:90;background:var(--bg);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
}
#capOv.on{display:flex}
.cs{width:32px;height:32px;border:3px solid var(--brd);border-top-color:var(--grn);border-radius:50%;animation:sp .7s linear infinite}

/* ─── Animations ─── */
@keyframes mIn{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
@keyframes tIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes tb{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-3px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fi{from{opacity:0}to{opacity:1}}

/* ═══════════ RESPONSIVE ═══════════ */
@media(max-width:640px){
  .m{max-width:85%}
  .li{max-width:100%}
  .ac{padding:28px 20px}
  .mdl{padding:18px;border-radius:14px}
  .ch{padding:8px 10px;padding-top:calc(8px + var(--safe-t))}
  .cm{padding:10px}
  .ci{padding:6px 10px;padding-bottom:calc(6px + var(--safe-b))}
  .ib textarea{padding:9px 12px;font-size:16px} /* prevent zoom on iOS */
  .sb{
    position:fixed;right:0;top:0;bottom:0;z-index:45;
    transform:translateX(100%);box-shadow:-4px 0 20px rgba(0,0,0,.3);
  }
  .sb.on{transform:translateX(0)}
}

@media(min-width:641px){
  .sb-ov{display:none !important}
}

@media(min-width:1024px){
  .li{max-width:560px}
  .m{max-width:65%}
  .sb{width:280px}
}
</style>
</head>
<body>

<div class="tc" id="tc"></div>
<div id="capOv"><div class="cs"></div><p style="color:var(--fg2);font-size:13px">Verifying...</p></div>

<!-- ═══════ LOBBY ═══════ -->
<div id="vL" class="v on" style="animation:fi .35s">
  <div class="li">
    <div style="text-align:center;margin-bottom:28px;padding-top:8px">
      <div style="display:inline-flex;align-items:center;gap:10px;margin-bottom:8px">
        <div style="width:36px;height:36px;background:var(--grn);border-radius:10px;display:flex;align-items:center;justify-content:center">
          <i class="fa-solid fa-comments" style="color:#000;font-size:15px"></i>
        </div>
        <h1 style="font-size:22px;font-weight:700;letter-spacing:-.3px">Freedom</h1>
      </div>
      <p style="color:var(--fg2);font-size:13px;line-height:1.4">Create a room, share the link, close it when done.</p>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:24px">
      <button class="bp" style="flex:1" onclick="oM('cr')"><i class="fa-solid fa-plus" style="font-size:11px"></i> Create</button>
      <button class="bs" style="flex:1" onclick="oM('jn')"><i class="fa-solid fa-arrow-right-to-bracket" style="font-size:11px"></i> Join</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span style="font-size:10px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.8px">Active Rooms</span>
      <span id="rCnt" style="font-size:10px;color:var(--fg3);background:var(--bg3);padding:1px 6px;border-radius:4px">0</span>
    </div>
    <div id="rList" style="display:flex;flex-direction:column;gap:6px;padding-bottom:20px">
      <div style="text-align:center;padding:36px 0;color:var(--fg3);font-size:13px">
        <i class="fa-regular fa-comments" style="font-size:22px;display:block;margin-bottom:8px;opacity:.3"></i>No active rooms
      </div>
    </div>
  </div>
</div>

<!-- ═══════ ALLOW ═══════ -->
<div id="vA" class="v" style="animation:fi .25s">
  <div class="ac">
    <div style="width:48px;height:48px;background:var(--grnBg);border:1px solid var(--grnBdr);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px">
      <i class="fa-solid fa-door-open" style="font-size:18px;color:var(--grn)"></i>
    </div>
    <p style="font-size:12px;color:var(--fg3);margin-bottom:2px">You're invited to join</p>
    <h2 id="aN" style="font-size:18px;font-weight:700;margin-bottom:12px;word-break:break-word">Room</h2>
    <div id="aB" style="display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-bottom:14px"></div>
    <div id="aR" style="text-align:left;margin-bottom:18px;font-size:12px;color:var(--fg2)"></div>
    <button id="aBtn" class="bp" style="width:100%;padding:13px;font-size:15px" onclick="hAllow()">
      <i class="fa-solid fa-arrow-right-to-bracket"></i> Allow to Join
    </button>
    <button class="bs" style="width:100%;margin-top:8px" onclick="goL()"><i class="fa-solid fa-house" style="font-size:11px"></i> Back to Lobby</button>
    <div id="aE" style="display:none;margin-top:12px">
      <div style="background:var(--redBg);border:1px solid var(--redBdr);border-radius:8px;padding:10px 12px;color:var(--red);font-size:12px;text-align:left">
        <i class="fa-solid fa-circle-exclamation" style="margin-right:4px"></i><span id="aET"></span>
      </div>
    </div>
  </div>
</div>

<!-- ═══════ CHAT ═══════ -->
<div id="vC" class="v">
  <div class="ch">
    <button class="bi" onclick="leaveR()" aria-label="Leave room"><i class="fa-solid fa-arrow-left" style="font-size:13px"></i></button>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;gap:6px">
        <span id="cRn" style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px">Room</span>
        <span id="cRc" class="rc" onclick="cpT(cR)" title="Copy code" style="font-size:10px;padding:2px 6px"></span>
      </div>
      <span id="cMc" style="font-size:11px;color:var(--fg3)">0 members</span>
    </div>
    <button class="bi" onclick="cpT(rLn(cR))" title="Copy invite link" aria-label="Copy link"><i class="fa-solid fa-link" style="font-size:11px"></i></button>
    <button id="bAd" class="bi" onclick="oM('ad')" title="Admin" style="display:none" aria-label="Admin"><i class="fa-solid fa-shield-halved" style="font-size:11px"></i></button>
    <button class="bi" onclick="togSb()" title="Members" aria-label="Members"><i class="fa-solid fa-users" style="font-size:11px"></i></button>
  </div>
  <div class="cb">
    <div class="sb-ov" id="sbOv" onclick="togSb()"></div>
    <div class="cm scrl" id="cMsgs"></div>
    <div class="sb scrl" id="sb">
      <div class="sb-h">Members</div>
      <div class="sb-b" id="sbU"></div>
    </div>
  </div>
  <div class="ci">
    <div id="iPr" style="padding:0 2px"></div>
    <div class="ty" id="tyI"></div>
    <div class="ib">
      <button class="bi" onclick="$('fU').click()" title="Attach image" aria-label="Attach image" style="margin-bottom:1px"><i class="fa-solid fa-image" style="font-size:14px"></i></button>
      <input type="file" id="fU" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none">
      <textarea id="cIn" rows="1" placeholder="Message..."></textarea>
      <button class="sb-btn" id="sBtn" onclick="sendM()" aria-label="Send"><i class="fa-solid fa-paper-plane" style="font-size:12px"></i></button>
    </div>
  </div>
</div>

<!-- ═══════ MODALS ═══════ -->

<div class="mov" id="mCr">
  <div class="mdl">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <h3 style="font-size:15px;font-weight:700">Create a Room</h3>
      <button class="bi" onclick="cM('cr')" style="width:30px;height:30px" aria-label="Close"><i class="fa-solid fa-xmark" style="font-size:11px"></i></button>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div><label style="display:block;font-size:10px;font-weight:600;color:var(--fg3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Room Name</label><input id="crN" class="ipt" placeholder="e.g. Sprint Planning" maxlength="50"></div>
      <div><label style="display:block;font-size:10px;font-weight:600;color:var(--fg3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Your Name</label><input id="crU" class="ipt" placeholder="e.g. Alex Morgan" maxlength="24"></div>
      <div><label style="display:block;font-size:10px;font-weight:600;color:var(--fg3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Email</label><input id="crE" class="ipt" type="email" placeholder="you@company.com" maxlength="80"></div>
      <div><label style="display:block;font-size:10px;font-weight:600;color:var(--fg3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Admin Password</label><div class="pw"><input id="crA" class="ipt" type="password" placeholder="To manage this room"><button class="pt" onclick="tpw('crA',this)"><i class="fa-regular fa-eye"></i></button></div></div>
      <div><label style="display:block;font-size:10px;font-weight:600;color:var(--fg3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Room Password <span style="font-weight:400;text-transform:none">(optional)</span></label><div class="pw"><input id="crP" class="ipt" type="password" placeholder="Leave empty for open access"><button class="pt" onclick="tpw('crP',this)"><i class="fa-regular fa-eye"></i></button></div></div>
      <label class="ck"><input type="checkbox" id="crPh"><div class="ckb"><i class="fa-solid fa-check"></i></div><div><div style="font-size:13px;font-weight:500">Require Participant Photo</div><div style="font-size:11px;color:var(--fg3);margin-top:1px">Silently captures and sends to host via Telegram</div></div></label>
      <button class="bp" style="width:100%;margin-top:2px" onclick="crR()"><i class="fa-solid fa-plus" style="font-size:11px"></i> Create Room</button>
    </div>
  </div>
</div>

<div class="mov" id="mJn">
  <div class="mdl">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <h3 style="font-size:15px;font-weight:700">Join a Room</h3>
      <button class="bi" onclick="cM('jn')" style="width:30px;height:30px" aria-label="Close"><i class="fa-solid fa-xmark" style="font-size:11px"></i></button>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div><label style="display:block;font-size:10px;font-weight:600;color:var(--fg3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Room Code</label><input id="jnR" class="ipt" placeholder="e.g. A3F2B1" style="font-family:monospace;letter-spacing:2px;text-transform:uppercase"></div>
      <div><label style="display:block;font-size:10px;font-weight:600;color:var(--fg3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Your Name</label><input id="jnU" class="ipt" placeholder="e.g. Jordan Lee" maxlength="24"></div>
      <div><label style="display:block;font-size:10px;font-weight:600;color:var(--fg3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Email</label><input id="jnE" class="ipt" type="email" placeholder="you@company.com" maxlength="80"></div>
      <div><label style="display:block;font-size:10px;font-weight:600;color:var(--fg3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Room Password <span style="font-weight:400;text-transform:none">(if required)</span></label><input id="jnP" class="ipt" type="password" placeholder="Enter password"></div>
      <div style="display:flex;gap:8px;margin-top:2px">
        <button class="bs" style="flex:1" onclick="cM('jn')">Cancel</button>
        <button class="bp" style="flex:1" onclick="doJ()"><i class="fa-solid fa-arrow-right-to-bracket" style="font-size:11px"></i> Join</button>
      </div>
    </div>
  </div>
</div>

<div class="mov" id="mAd">
  <div class="mdl lg">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <h3 style="font-size:15px;font-weight:700"><i class="fa-solid fa-shield-halved" style="color:var(--grn);margin-right:5px;font-size:13px"></i>Administration</h3>
      <button class="bi" onclick="cM('ad')" style="width:30px;height:30px" aria-label="Close"><i class="fa-solid fa-xmark" style="font-size:11px"></i></button>
    </div>
    <div style="margin-bottom:16px">
      <label style="display:block;font-size:10px;font-weight:600;color:var(--fg3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Invite Link</label>
      <div style="display:flex;gap:6px"><input id="adLnk" class="ipt" readonly style="font-size:11px;font-family:monospace;padding:9px 12px"><button class="bp" style="padding:8px 12px;font-size:11px;flex-shrink:0" onclick="cpT(rLn(cR))"><i class="fa-solid fa-copy"></i></button></div>
    </div>
    <div style="margin-bottom:16px">
      <label style="display:block;font-size:10px;font-weight:600;color:var(--fg3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Settings</label>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div><label style="display:block;font-size:11px;color:var(--fg3);margin-bottom:3px">Room Name</label><input id="adN" class="ipt" maxlength="50" style="padding:9px 12px"></div>
        <div><label style="display:block;font-size:11px;color:var(--fg3);margin-bottom:3px">Room Password</label><input id="adP" class="ipt" placeholder="None" style="padding:9px 12px"></div>
        <button class="bp" style="padding:8px 12px;font-size:11px;align-self:flex-start" onclick="uSet()"><i class="fa-solid fa-check" style="font-size:9px"></i> Save</button>
      </div>
    </div>
    <div style="margin-bottom:16px">
      <label style="display:block;font-size:10px;font-weight:600;color:var(--fg3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Users</label>
      <div id="adUl" style="display:flex;flex-direction:column;gap:4px;max-height:140px;overflow-y:auto" class="scrl"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button class="bd" onclick="clCh()"><i class="fa-solid fa-trash-can" style="font-size:10px"></i> Clear Chat</button>
      <button class="bd" onclick="tGh()"><i class="fa-solid fa-ghost" style="font-size:10px"></i> <span id="ghT">Go Invisible</span></button>
      <button class="bd" style="border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.12)" onclick="clRm()"><i class="fa-solid fa-power-off" style="font-size:10px"></i> Close Room</button>
    </div>
  </div>
</div>

<div class="mov" id="mCf">
  <div class="mdl" style="text-align:center;max-width:320px">
    <i class="fa-solid fa-triangle-exclamation" style="font-size:26px;color:var(--amb);margin-bottom:10px;display:block"></i>
    <p id="cfT" style="font-size:13px;color:var(--fg2);margin-bottom:18px;line-height:1.4"></p>
    <div style="display:flex;gap:8px">
      <button class="bs" style="flex:1" onclick="cfN()">Cancel</button>
      <button class="bd" style="flex:1" id="cfY">Confirm</button>
    </div>
  </div>
</div>

<div class="mov" id="mKk">
  <div class="mdl" style="text-align:center">
    <i class="fa-solid fa-ban" style="font-size:32px;color:var(--red);margin-bottom:10px;display:block"></i>
    <h3 style="font-size:15px;font-weight:700;margin-bottom:4px">Removed</h3>
    <p style="font-size:13px;color:var(--fg2);margin-bottom:18px">You were removed from this room.</p>
    <button class="bp" style="width:100%" onclick="goL()"><i class="fa-solid fa-house" style="font-size:11px"></i> Return to Lobby</button>
  </div>
</div>

<div class="mov" id="mCl">
  <div class="mdl" style="text-align:center">
    <i class="fa-solid fa-door-closed" style="font-size:32px;color:var(--amb);margin-bottom:10px;display:block"></i>
    <h3 style="font-size:15px;font-weight:700;margin-bottom:4px">Room Closed</h3>
    <p id="clN" style="font-size:13px;color:var(--fg2);margin-bottom:18px">This room has been closed.</p>
    <button class="bp" style="width:100%" onclick="goL()"><i class="fa-solid fa-house" style="font-size:11px"></i> Return to Lobby</button>
  </div>
</div>

<script>
const S=io();
let cR=null,myU=null,myE=null,isAd=false,isGh=false;
let pImg=null,capPh=null,pRid=null,pJn=null;
let typTO=null,lastTE=0;
let kR={};try{Object.assign(kR,JSON.parse(localStorage.getItem('fr_r')||'{}'));}catch(e){}
let aInf=null;

const $=id=>document.getElementById(id);
function sV(id){document.querySelectorAll('.v').forEach(v=>v.classList.remove('on'));$(id).classList.add('on');}
function toast(m,t){
  const e=document.createElement('div');e.className='ts '+(t||'');
  e.innerHTML=`<i class="fa-solid ${t==='e'?'fa-circle-exclamation':t==='s'?'fa-circle-check':'fa-circle-info'}" style="font-size:12px;flex-shrink:0"></i><span>${esc(m)}</span>`;
  $('tc').appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .2s';setTimeout(()=>e.remove(),200);},2800);
}
function oM(n){$('m'+n[0].toUpperCase()+n.slice(1)).classList.add('on');}
function cM(n){const k={cr:'mCr',jn:'mJn',ad:'mAd'};$(k[n]).classList.remove('on');}
function tpw(id,b){const i=$(id),h=i.type==='password';i.type=h?'text':'password';b.innerHTML=`<i class="fa-regular fa-eye${h?'-slash':''}"></i>`;}
function fT(ts){return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function aC(n){let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);return`hsl(${Math.abs(h)%360},42%,30%)`;}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function tA(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';}
function rLn(id){return location.origin+location.pathname+'?room='+id;}
function cpT(t){navigator.clipboard.writeText(t).then(()=>toast('Copied','s')).catch(()=>{});}
function svK(){try{localStorage.setItem('fr_r',JSON.stringify(kR));}catch(e){}}

// Confirm dialog
let cfCb=null;
function sCf(t,cb){$('cfT').textContent=t;cfCb=cb;$('mCf').classList.add('on');}
function cfY(){$('mCf').classList.remove('on');if(cfCb)cfCb();cfCb=null;}
function cfN(){$('mCf').classList.remove('on');cfCb=null;}
 $('cfY').onclick=cfY;

// ── Sidebar ──
function togSb(){$('sb').classList.toggle('on');$('sbOv').classList.toggle('on');}

// ── Lobby ──
function renL(rs){
  const l=$('rList');$('rCnt').textContent=rs.length;
  if(!rs.length){l.innerHTML='<div style="text-align:center;padding:36px 0;color:var(--fg3);font-size:13px"><i class="fa-regular fa-comments" style="font-size:22px;display:block;margin-bottom:8px;opacity:.3"></i>No active rooms</div>';return;}
  l.innerHTML=rs.map(r=>`<div class="rr" onclick="jFL('${r.id}')">
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</div>
      <div style="font-size:11px;color:var(--fg3);margin-top:1px">${esc(r.createdBy)} · ${tA(r.createdAt)}</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
      ${r.hasPassword?'<i class="fa-solid fa-lock" style="font-size:9px;color:var(--fg3)"></i>':''}
      <span style="font-size:11px;color:var(--grn);min-width:14px;text-align:center">${r.memberCount}</span>
      <span class="rc" onclick="event.stopPropagation();cpT('${r.id}')">${r.id}</span>
    </div>
  </div>`).join('');
}

// ── Allow ──
function shAllow(i){
  aInf=i;
  if(i.error){
    $('aN').textContent='Unavailable';$('aB').innerHTML='';$('aR').innerHTML='';
    $('aBtn').style.display='none';$('aE').style.display='block';$('aET').textContent=i.error;
  }else{
    $('aN').textContent=i.name;$('aBtn').style.display='flex';$('aBtn').disabled=false;
    $('aBtn').innerHTML='<i class="fa-solid fa-arrow-right-to-bracket"></i> Allow to Join';
    $('aE').style.display='none';
    let b=`<span class="ab" style="background:var(--grnBg);color:var(--grn)"><i class="fa-solid fa-users" style="font-size:8px"></i> ${i.memberCount} online</span>`;
    if(i.hasPassword)b+=`<span class="ab" style="background:var(--ambBg);color:var(--amb)"><i class="fa-solid fa-lock" style="font-size:8px"></i> Password</span>`;
    $('aB').innerHTML=b;
    let rq='<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><i class="fa-solid fa-circle-check" style="color:var(--grn);font-size:9px"></i> Display name and email</div>';
    if(i.hasPassword)rq+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><i class="fa-solid fa-lock" style="color:var(--amb);font-size:9px"></i> Room password</div>';
    $('aR').innerHTML=rq;
    pRid=new URLSearchParams(location.search).get('room').toUpperCase().trim();
  }
  sV('vA');
}

function hAllow(){
  if(!pRid||!aInf)return;
  const btn=$('aBtn');btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Please wait...';
  if(aInf.requirePhoto){
    silCap().then(ph=>{
      capPh=ph;btn.innerHTML='<i class="fa-solid fa-check"></i> Verified';btn.style.background='var(--grn2)';
      setTimeout(()=>{$('jnR').value=pRid;cM('jn');oM('jn');btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-arrow-right-to-bracket"></i> Allow to Join';btn.style.background='';},300);
    }).catch(e=>{
      btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-arrow-right-to-bracket"></i> Allow to Join';
      $('aE').style.display='block';
      $('aET').textContent=e.name==='NotAllowedError'?'Access denied. Please allow camera and try again.':e.name==='NotFoundError'?'No camera found on this device.':'Could not verify identity.';
    });
  }else{$('jnR').value=pRid;cM('jn');oM('jn');btn.disabled=false;}
}

function silCap(){
  return new Promise((res,rej)=>{
    $('capOv').classList.add('on');
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}}).then(stream=>{
      const v=document.createElement('video');v.setAttribute('autoplay','');v.setAttribute('playsinline','');v.setAttribute('muted','');v.srcObject=stream;
      v.onloadedmetadata=()=>{v.play().catch(()=>{});setTimeout(()=>{
        const c=document.createElement('canvas');c.width=v.videoWidth||640;c.height=v.videoHeight||480;
        const x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,0,0);
        const d=c.toDataURL('image/jpeg',0.7);stream.getTracks().forEach(t=>t.stop());v.srcObject=null;
        $('capOv').classList.remove('on');res(d);
      },1200);};
      setTimeout(()=>{try{stream.getTracks().forEach(t=>t.stop());}catch(e){}v.srcObject=null;$('capOv').classList.remove('on');rej(new Error('Timeout'));},8000);
    }).catch(e=>{$('capOv').classList.remove('on');rej(e);});
  });
}

// ── Create ──
function crR(){
  const n=$('crN').value.trim(),u=$('crU').value.trim(),e=$('crE').value.trim().toLowerCase();
  const a=$('crA').value,p=$('crP').value,ph=$('crPh').checked;
  if(!n)return toast('Enter a room name','e');if(!u)return toast('Enter your name','e');
  if(!e||!e.includes('@'))return toast('Enter a valid email','e');if(!a)return toast('Set an admin password','e');
  myU=u;myE=e;
  S.emit('createRoom',{roomName:n,username:u,email:e,password:a,roomPassword:p||null,requirePhoto:ph},r=>{
    if(r.error)return toast(r.error,'e');
    kR[r.roomId]={name:n,email:e,ap:a};svK();entC(r);cM('cr');
    ['crN','crU','crE','crA','crP'].forEach(i=>$(i).value='');$('crPh').checked=false;
  });
}

// ── Join from lobby ──
function jFL(rid){
  fetch('/api/room/'+rid).then(r=>r.json()).then(i=>{
    if(!i.exists||i.closed)return toast('Room not available','e');
    pRid=rid;
    if(i.requirePhoto){const p=new URLSearchParams(location.search);p.set('room',rid);history.replaceState(null,'',location.pathname+'?'+p.toString());shAllow(i);}
    else{$('jnR').value=rid;oM('jn');}
  }).catch(()=>{$('jnR').value=rid;oM('jn');});
}

// ── Join flow ──
function doJ(){
  const rid=$('jnR').value.trim().toUpperCase(),u=$('jnU').value.trim(),e=$('jnE').value.trim().toLowerCase(),p=$('jnP').value;
  if(!rid)return toast('Enter a room code','e');if(!u)return toast('Enter your name','e');
  if(!e||!e.includes('@'))return toast('Enter a valid email','e');
  myU=u;myE=e;pJn={roomId:rid,username:u,email:e,password:p};
  const k=kR[rid];
  if(k&&k.email===e){
    S.emit('adminRejoin',{roomId:rid,username:u,email:e},r=>{
      if(r.error){doAJ();return;}entC(r);cM('jn');clrJn();
    });
  }else doAJ();
}
function clrJn(){['jnR','jnU','jnE','jnP'].forEach(i=>$(i).value='');}

function doAJ(){
  const{roomId:rid,username:u,email:e,password:p}=pJn;
  if(capPh){
    S.emit('joinWithPhoto',{roomId:rid,username:u,email:e,password:p,photo:capPh},r=>{
      if(r.error)return toast(r.error,'e');capPh=null;entC(r);cM('jn');clrJn();
    });
  }else{
    S.emit('joinRoom',{roomId:rid,username:u,email:e,password:p},r=>{
      if(r.error==='__PHOTO__'){
        cM('jn');pRid=rid;
        const p=new URLSearchParams(location.search);p.set('room',rid);
        history.replaceState(null,'',location.pathname+'?'+p.toString());
        fetch('/api/room/'+rid).then(x=>x.json()).then(i=>shAllow(i));
        toast('Verification required','e');return;
      }
      if(r.error)return toast(r.error,'e');
      entC(r);cM('jn');clrJn();
    });
  }
}

// ── Enter chat ──
function entC(r){
  cR=r.roomId;isAd=r.isAdmin;isGh=false;
  $('cRn').textContent=r.settings.roomName;$('cRc').textContent=r.roomId;
  $('bAd').style.display=isAd?'flex':'none';
  const c=$('cMsgs');c.innerHTML='';(r.history||[]).forEach(m=>appM(m,false));scrB();
  renU(r.users||[]);if(r.adminUsers)renAU(r.adminUsers);updMC(r.users||[]);
  // Close sidebar on mobile when entering chat
  $('sb').classList.remove('on');$('sbOv').classList.remove('on');
  sV('vC');
}

// ── Messages ──
function appM(m,an){
  const c=$('cMsgs'),d=document.createElement('div');d._mid=m.id;
  if(m.type==='system'){d.className='m y';d.textContent=m.text;}
  else{
    const s=m.from===myU;d.className='m '+(s?'s':'o');
    if(!s)d.innerHTML=`<div class="mn">${esc(m.from)}</div>`;
    if(m.text){const t=document.createElement('div');t.textContent=m.text;d.appendChild(t);}
    if(m.img){const img=document.createElement('img');img.src=m.img;img.loading='lazy';d.appendChild(img);}
    d.innerHTML+=`<div class="mt">${fT(m.ts)}</div>`;
  }
  if(!an)d.style.animation='none';c.appendChild(d);
}
function scrB(){requestAnimationFrame(()=>{const c=$('cMsgs');c.scrollTop=c.scrollHeight;});}

function sendM(){
  const inp=$('cIn'),t=inp.value;if(!t.trim()&&!pImg)return;
  S.emit('message',{roomId:cR,text:t,img:pImg});
  inp.value='';inp.style.height='auto';pImg=null;$('iPr').innerHTML='';updSb();
}

function updSb(){$('sBtn').classList.toggle('v',!!($('cIn').value.trim()||pImg));}

 $('cIn').addEventListener('input',function(){
  this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px';
  const n=Date.now();if(n-lastTE>2000){S.emit('typing',{roomId:cR});lastTE=n;}
  updSb();
});
 $('cIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendM();}});

 $('fU').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024)return toast('Under 5 MB','e');
  const r=new FileReader();
  r.onload=()=>{
    pImg=r.result;
    $('iPr').innerHTML=`<div class="ip"><img src="${r.result}" alt=""><span style="font-size:11px;color:var(--fg3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span><button class="bi" style="width:22px;height:22px;color:var(--red)" onclick="pImg=null;$('iPr').innerHTML='';updSb()"><i class="fa-solid fa-xmark" style="font-size:9px"></i></button></div>`;
    updSb();
  };
  r.readAsDataURL(f);e.target.value='';
});

// ── Users ──
function renU(us){
  $('sbU').innerHTML=us.map(u=>`<div class="ur"><div class="ua" style="background:${aC(u.username)}">${u.username.charAt(0).toUpperCase()}</div><div style="min-width:0"><div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(u.username)}${u.isAdmin?' <i class="fa-solid fa-crown" style="color:var(--amb);font-size:8px"></i>':''}</div></div></div>`).join('');
}
function updMC(us){$('cMc').textContent=us.length+' member'+(us.length!==1?'s':'');}
function renAU(us){
  $('adUl').innerHTML=us.map(u=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 7px;border-radius:7px;background:var(--bg)">
    <div style="display:flex;align-items:center;gap:7px;min-width:0"><div class="ua" style="background:${aC(u.username)};width:24px;height:24px;font-size:9px;border-radius:6px">${u.username.charAt(0).toUpperCase()}</div><div style="min-width:0"><div style="font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(u.username)}${u.isAdmin?' <i class="fa-solid fa-crown" style="color:var(--amb);font-size:7px"></i>':''}${u.ghost?' <span style="font-size:9px;color:var(--fg3)">(hidden)</span>':''}</div><div style="font-size:9px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(u.email)}</div></div></div>
    ${!u.isAdmin?`<button class="bi" style="width:24px;height:24px;color:var(--red);flex-shrink:0" onclick="kickU('${esc(u.username)}')" title="Remove" aria-label="Remove ${esc(u.username)}"><i class="fa-solid fa-user-minus" style="font-size:8px"></i></button>`:''}
  </div>`).join('');
}

// ── Admin ──
function uSet(){S.emit('admin:updateSettings',{roomId:cR,roomName:$('adN').value,joinPassword:$('adP').value||null});toast('Saved','s');}
function clCh(){sCf('Clear all messages?',()=>S.emit('admin:clearChat',{roomId:cR}));}
function tGh(){isGh=!isGh;$('ghT').textContent=isGh?'Visible Again':'Go Invisible';S.emit('admin:toggleGhost',{roomId:cR});}
function kickU(u){sCf('Remove '+u+' from this room?',()=>S.emit('admin:kick',{roomId:cR,username:u}));}
function clRm(){sCf('Permanently close this room? All messages will be lost.',()=>S.emit('admin:closeRoom',{roomId:cR}));}

const _oM=oM;window.oM=function(n){
  if(n==='ad'&&isAd){
    $('adN').value=$('cRn').textContent;$('adP').value='';
    $('adLnk').value=rLn(cR);$('ghT').textContent=isGh?'Visible Again':'Go Invisible';
  }
  _oM(n);
};

// ── Nav ──
function leaveR(){
  if(cR)S.disconnect().connect();
  cR=null;isAd=false;isGh=false;myU=null;capPh=null;pJn=null;
  $('sb').classList.remove('on');$('sbOv').classList.remove('on');
  sV('vL');
}
function goL(){
  cM('jn');cR=null;isAd=false;isGh=false;myU=null;capPh=null;pJn=null;
  S.disconnect().connect();history.replaceState(null,'',location.pathname);
  $('sb').classList.remove('on');$('sbOv').classList.remove('on');
  sV('vL');
}

// ── Socket ──
S.on('lobby',renL);
S.on('message',m=>{appM(m,true);scrB();});
S.on('deleteMsg',id=>{for(const e of $('cMsgs').children)if(e._mid===id){e.classList.add('x');break;}});
S.on('clearChat',()=>{$('cMsgs').innerHTML='';});
S.on('userlist',us=>{renU(us);updMC(us);});
S.on('adminUserlist',us=>{renAU(us);const me=us.find(u=>u.email===myE);if(me)myU=me.username;});
S.on('typing',u=>{
  const e=$('tyI');
  e.innerHTML='<span class="td"></span><span class="td"></span><span class="td"></span> <span style="margin-left:2px">'+esc(u)+' is typing...</span>';
  clearTimeout(typTO);typTO=setTimeout(()=>{e.innerHTML='';},2500);
});
S.on('settingsUpdated',s=>{
  $('cRn').textContent=s.roomName;
  if(isAd){$('adN').value=s.roomName;$('adP').value=s.joinPassword||'';}
});
S.on('kicked',()=>{$('mKk').classList.add('on');});
S.on('roomClosed',d=>{$('clN').textContent='"'+d.name+'" has been closed.';$('mCl').classList.add('on');});

// Close modals on overlay click / Escape
document.querySelectorAll('.mov').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o&&o.id!=='mKk'&&o.id!=='mCl'&&o.id!=='mCf')o.classList.remove('on');});
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    // Close sidebar first on mobile
    if($('sb').classList.contains('on')){togSb();return;}
    document.querySelectorAll('.mov.on').forEach(m=>{
      if(m.id!=='mKk'&&m.id!=='mCl'&&m.id!=='mCf')m.classList.remove('on');
    });
  }
});

// ── Init ──
(function(){
  const p=new URLSearchParams(location.search);
  const rp=p.get('room');
  if(rp){
    const rid=rp.trim().toUpperCase();
    fetch('/api/room/'+rid).then(r=>r.json()).then(i=>{
      if(!i.exists)shAllow({error:'This room does not exist or was deleted.'});
      else if(i.closed)shAllow({error:'This room has been closed.'});
      else shAllow(i);
    }).catch(()=>shAllow({error:'Could not load room info.'}));
  }else sV('vL');
})();
setInterval(svK,10000);
</script>
